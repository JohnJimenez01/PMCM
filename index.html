<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#f6e7e4" />
  <title>Nuestro primer mes</title>

  <!-- Tipografías -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Nunito+Sans:wght@300;400;600&family=Dancing+Script:wght@500;600&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <!-- Botón de música (se muestra solo si hay canción configurada) -->
  <button id="btn-musica" class="btn-musica" aria-label="Reproducir música" hidden>
    <span class="nota">♪</span>
  </button>
  <audio id="audio" loop preload="none"></audio>

  <!-- Botón volver arriba -->
  <button id="btn-top" class="btn-top" aria-label="Volver al inicio" hidden>↑</button>

  <!-- ============ SECCIÓN 1: BIENVENIDA ============ -->
  <section id="bienvenida" class="hero">
    <div class="hero-foto" id="hero-foto"></div>
    <div class="hero-overlay"></div>
    <div class="hero-contenido reveal">
      <p class="hero-saludo" id="bv-saludo"></p>
      <h1 class="hero-titulo" id="bv-titulo"></h1>
      <p class="hero-sub" id="bv-sub"></p>
      <a href="#un-mes" class="boton" id="bv-boton"></a>
    </div>
    <div class="scroll-hint" aria-hidden="true">⌄</div>
  </section>

  <!-- ============ SECCIÓN 2: UN MES DE NOSOTROS ============ -->
  <section id="un-mes" class="seccion mes">
    <div class="mes-grid">
      <div class="mes-foto reveal">
        <div class="marco" id="mes-foto"></div>
      </div>
      <div class="mes-texto reveal">
        <h2 id="mes-titulo" class="titulo"></h2>
        <div class="contador" id="contador" aria-label="Tiempo juntos"></div>
        <p id="mes-parrafo"></p>
      </div>
    </div>
  </section>

  <!-- ============ SECCIÓN 3: GALERÍA ============ -->
  <section id="galeria" class="seccion galeria-sec">
    <h2 class="titulo centro reveal">Nuestra galería</h2>
    <p class="subtitulo centro reveal">Un vistazo a estos días.</p>
    <div class="galeria" id="galeria"></div>
  </section>

  <!-- ============ SECCIÓN 4: LO QUE ME HACES SENTIR ============ -->
  <section id="sentir" class="seccion sentir">
    <h2 class="titulo centro reveal">Lo que me haces sentir</h2>
    <div class="frases" id="frases"></div>
  </section>

  <!-- ============ SECCIÓN 5: PEQUEÑOS RECUERDOS ============ -->
  <section id="recuerdos" class="seccion recuerdos-sec">
    <h2 class="titulo centro reveal">Pequeños recuerdos</h2>
    <div class="timeline" id="timeline"></div>
  </section>

  <!-- ============ SECCIÓN 6: CARTA ============ -->
  <section id="carta" class="seccion carta-sec">
    <div class="carta reveal">
      <h2 class="titulo centro" id="carta-titulo"></h2>
      <p class="carta-saludo" id="carta-saludo"></p>
      <div id="carta-cuerpo"></div>
      <p class="carta-firma" id="carta-firma"></p>
    </div>
  </section>

  <!-- ============ SECCIÓN 7: CIERRE ============ -->
  <section id="cierre" class="hero cierre">
    <div class="hero-foto" id="cierre-foto"></div>
    <div class="hero-overlay"></div>
    <div class="hero-contenido reveal">
      <h2 class="hero-titulo" id="cierre-frase"></h2>
      <p class="hero-sub" id="cierre-sub"></p>
      <div class="corazon-final" aria-hidden="true">🤍</div>
      <a href="#bienvenida" class="boton boton-claro">Volver al inicio</a>
    </div>
  </section>

  <!-- Partículas sutiles (corazones flotantes) -->
  <div class="particulas" id="particulas" aria-hidden="true"></div>

  <script src="js/config.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
